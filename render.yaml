services:
  - type: web
    name: prometeo-yopal
    runtime: docker
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prometeo-db
          property: connectionString
      - key: CACHE_URL
        fromService:
          type: keyvalue
          name: prometeo-cache
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin-evaluacion@prometeo.example
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true

  - type: keyvalue
    name: prometeo-cache
    plan: free
    region: virginia
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: prometeo-db
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    ipAllowList: []
