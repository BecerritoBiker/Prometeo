services:
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
    environment:
      POSTGRES_DB: prometeo
      POSTGRES_USER: prometeo
      TZ: America/Bogota
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - database_credentials:/run/prometeo
    networks: [datos]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "prometeo", "-d", "prometeo"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  cache:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [datos]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 8
    restart: unless-stopped

  app:
    build: .
    environment:
      PORT: 8080
      DB_HOST: db
      DB_NAME: prometeo
      DB_USER: prometeo
      DB_PASSWORD_FILE: /run/prometeo/password
      CACHE_URL: redis://cache:6379
      TRUST_PROXY: 1
    networks: [frontera, datos]
    volumes:
      - database_credentials:/run/prometeo:ro
    depends_on:
      db:
        condition: service_healthy
        restart: true
      cache:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    networks: [frontera]
    depends_on:
      app:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 4s
      retries: 8
    restart: unless-stopped

networks:
  frontera:
  datos:
    internal: true

volumes:
  postgres_data:
  database_credentials:
